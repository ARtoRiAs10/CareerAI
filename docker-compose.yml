version: '3.9'

services:

  # ── Spring Boot Backend ─────────────────────────────────────────────
  backend:
    build:
      context: ./ai-job-recommender/backend
      dockerfile: Dockerfile
    container_name: careerai-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    networks:
      - careerai_net
    # No ports exposed directly — Nginx handles routing

  # ── Next.js Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./ai-job-recommender/frontend
      dockerfile: Dockerfile
      args:
        # Empty string = use relative URLs, Nginx proxies /api to backend
        NEXT_PUBLIC_API_URL: ""
    container_name: careerai-frontend
    restart: unless-stopped
    networks:
      - careerai_net

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: careerai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - careerai_net

# ── No DB container needed — using Neon DB (cloud) ───────────────────
# ── No volumes needed — data lives in Neon ───────────────────────────

networks:
  careerai_net:
    name: careerai_net
    driver: bridge